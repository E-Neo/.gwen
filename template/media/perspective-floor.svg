<svg xmlns="http://www.w3.org/2000/svg"
     width="258" height="30" viewBox="0 0 258 30"
     role="img" aria-label="Perspective floor">
  <title>Perspective floor</title>

  <defs>
    <filter id="pf-soft"
            x="-2" y="-2" width="262" height="34"
            filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.2"
                      color-interpolation-filters="sRGB"/>
    </filter>

    <linearGradient id="pf-fill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#8f8f8f" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#8f8f8f" stop-opacity="0.2"/>
      <stop offset="0.75" stop-color="#8f8f8f" stop-opacity="0.2"/>
      <stop offset="1"    stop-color="#8f8f8f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#pf-soft)" pointer-events="none">
    <!-- Three nested trapezoids sharing the centre line x=129; the blur filter
         fades their ends so they read as a receding floor. Outer, middle, inner. -->
    <path d="M102.5 1H155.5L256.3 28H1.7Z" fill="url(#pf-fill)"/>
    <path d="M100.8 6H157.2L211.1 28H46.9Z" fill="url(#pf-fill)"/>
    <path d="M116.1 5.5H141.9L170.5 28H87.5Z" fill="url(#pf-fill)"/>
  </g>
</svg>
