# 等宽卡片 + 阶梯的完整示例：把写作原则（逻辑 -> 结构 -> 版面 -> 打磨）
# 摆成一条向上走的阶梯，每级都是 card_title + card 的等宽卡片。
# 顶部一条横向说明带；四张卡片立在 y=15.55 的基线上，从左到右升高，
# 各自的标题居中。斜角处放一段阅读提示，别让它空着。
# master："content"。复制到 slides/ 并在 [[sections]] 里登记。

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: 标题：一个观察，以及它意味着什么"

# 横向说明带：一句话讲清全页唯一的那条逻辑。
[[shapes]]
type = "rect"
x = "1.5cm"
y = "2.5cm"
w = "30.9cm"
h = "1.3cm"
fill = { color = "F7F7F7" }
line = { type = "none" }

[[shapes]]
type = "text"
x = "1.5cm"
y = "2.5cm"
w = "30.9cm"
h = "1.3cm"
text = "**每条原则都建立在前一条之上**：从标题的观点，到一眼能读懂的页面"
color = "1D1D1B"
valign = "middle"
margin = ["0.1cm", "0.4cm", "0.1cm", "0.4cm"]

# 四级阶梯共用的基线。
[[shapes]]
type = "rect"
x = "1.5cm"
y = "15.55cm"
w = "30.9cm"
h = "0.05cm"
fill = { color = "A6A6A6" }
line = { type = "none" }

# 斜角处放阅读提示：贴近阶梯的对角线，而不是缩在左上角。
[[shapes]]
type = "text"
x = "2.2cm"
y = "5.6cm"
w = "4.4cm"
h = "2.7cm"
color = "1D1D1B"
valign = "top"
margin = 0
text = """**顺着对角读**
每级继承上一级
从立论到复核，
一级比一级具体"""

# 斜角上方的三根曲线箭头，一级一根：起点在当前一级顶边的中点上方，
# 向右上弯到下一级的左上角。每根就是一条三次贝塞尔（cust_geom），
# 上升是平滑的，末端切线和三角箭头对齐。曲线在三角底下收住，
# 避免圆头线帽从尖端露出来。旁边的标签贴近曲线说明这一步多了什么。
# 箭头 1 -> 2。
[[shapes]]
type = "cust_geom"
x = "5.6cm"
y = "8.9cm"
w = "3.8cm"
h = "1.6cm"
line = { color = "A6A6A6", width = 2 }
points = [
  { x = "0cm", y = "1.6cm" },
  { x = "3.45cm", y = "0.03cm", curve = { type = "cubic", x1 = "0.985cm", y1 = "0.752cm", x2 = "2.405cm", y2 = "0.119cm" } },
]

[[shapes]]
type = "triangle"
x = "8.926cm"
y = "8.694cm"
w = "0.5cm"
h = "0.45cm"
fill = { color = "A6A6A6" }
line = { type = "none" }
rotate = 85.1

[[shapes]]
type = "text"
x = "5.3cm"
y = "8.55cm"
w = "4.4cm"
h = "0.5cm"
color = "595959"
align = "center"
valign = "middle"
margin = 0
text = "多一条逻辑"

# 箭头 2 -> 3.
[[shapes]]
type = "cust_geom"
x = "13cm"
y = "7.3cm"
w = "3.8cm"
h = "1.6cm"
line = { color = "A6A6A6", width = 2 }
points = [
  { x = "0cm", y = "1.6cm" },
  { x = "3.45cm", y = "0.03cm", curve = { type = "cubic", x1 = "0.985cm", y1 = "0.752cm", x2 = "2.405cm", y2 = "0.119cm" } },
]

[[shapes]]
type = "triangle"
x = "16.326cm"
y = "7.094cm"
w = "0.5cm"
h = "0.45cm"
fill = { color = "A6A6A6" }
line = { type = "none" }
rotate = 85.1

[[shapes]]
type = "text"
x = "12.7cm"
y = "7.1cm"
w = "4.4cm"
h = "0.5cm"
color = "595959"
align = "center"
valign = "middle"
margin = 0
text = "算出网格"

# 箭头 3 -> 4.
[[shapes]]
type = "cust_geom"
x = "20.4cm"
y = "5.7cm"
w = "3.8cm"
h = "1.6cm"
line = { color = "A6A6A6", width = 2 }
points = [
  { x = "0cm", y = "1.6cm" },
  { x = "3.45cm", y = "0.03cm", curve = { type = "cubic", x1 = "0.985cm", y1 = "0.752cm", x2 = "2.405cm", y2 = "0.119cm" } },
]

[[shapes]]
type = "triangle"
x = "23.726cm"
y = "5.494cm"
w = "0.5cm"
h = "0.45cm"
fill = { color = "A6A6A6" }
line = { type = "none" }
rotate = 85.1

[[shapes]]
type = "text"
x = "20.1cm"
y = "5.5cm"
w = "4.4cm"
h = "0.5cm"
color = "595959"
align = "center"
valign = "middle"
margin = 0
text = "打磨密度"

# 第 1 级。
[[shapes]]
type = "rect"
x = "2cm"
y = "11cm"
w = "7.2cm"
h = "1.3cm"
styles = "card_title"
align = "center"
text = "阶段 1 · 逻辑"

[[shapes]]
type = "rect"
x = "2cm"
y = "12.3cm"
w = "7.2cm"
h = "3.25cm"
styles = "card"
text = """标题给观点：观察 + 含义
**检查**：只看标题能复述吗？
**成果**：一眼能读懂的标题"""

# 第 2 级。
[[shapes]]
type = "rect"
x = "9.4cm"
y = "9.4cm"
w = "7.2cm"
h = "1.3cm"
styles = "card_title"
align = "center"
text = "阶段 2 · 结构"

[[shapes]]
type = "rect"
x = "9.4cm"
y = "10.7cm"
w = "7.2cm"
h = "4.85cm"
styles = "card"
text = """每页一条逻辑线；整份胶片从宏观到微观，再回到宏观

- 一条线索，不是一串事实

**检查**：删掉这一页，故事还成立吗？
**成果**：前后咬合的整份胶片"""

# 第 3 级。
[[shapes]]
type = "rect"
x = "16.8cm"
y = "7.8cm"
w = "7.2cm"
h = "1.3cm"
styles = "card_title"
align = "center"
text = "阶段 3 · 版面"

[[shapes]]
type = "rect"
x = "16.8cm"
y = "9.1cm"
w = "7.2cm"
h = "6.45cm"
styles = "card"
text = """**把几何算出来**
33.88 × 19.05cm
中线 16.94cm

- 对称两栏：1.5/15 + 17.4/15
- 内容区 2.7–15.9cm

**检查**：卡片顶端、宽度、文字左边界对齐了吗？
**成果**：两栏平衡"""

# 第 4 级，当前这一步，用红色强调。
[[shapes]]
type = "rect"
x = "24.2cm"
y = "6.2cm"
w = "7.2cm"
h = "1.3cm"
styles = "card_title"
align = "center"
fill = { color = "C7000A" }
color = "FFFFFF"
text = "阶段 4 · 打磨"

[[shapes]]
type = "rect"
x = "24.2cm"
y = "7.5cm"
w = "7.2cm"
h = "8.05cm"
styles = "card"
text = """打磨到没有一处死白为止

- 没有明显的空区
- 颜色要少：黑白灰 + 红蓝强调
- 启示本身也要是一个观点

**检查**：只看标题和启示，观点成立吗？
**成果**：致密、完成的页面"""

[[shapes]]
type = "text"
x = "1.5cm"
y = "16.25cm"
w = "30.9cm"
h = "0.9cm"
styles = "insight"
text = "一页 = 标题 + 一条逻辑 + 启示；三样都验过再收手"
