# Step 1.
[[shapes]]
type = "rect"
x = "2cm"
y = "11cm"
w = "7.2cm"
h = "1.3cm"
styles = "card_header"
align = "center"
text = "PHASE 1 · Claim"

[[shapes]]
type = "rect"
x = "2cm"
y = "12.3cm"
w = "7.2cm"
h = "3.25cm"
styles = "card_body"
paragraphs = [
  { text = "A title is a claim, not a keyword: observation + implication." },
  { text = "**Outcome:** scan-ready title" },
]

# Step 2.
[[shapes]]
type = "rect"
x = "9.4cm"
y = "9.4cm"
w = "7.2cm"
h = "1.3cm"
styles = "card_header"
align = "center"
text = "PHASE 2 · Structure"

[[shapes]]
type = "rect"
x = "9.4cm"
y = "10.7cm"
w = "7.2cm"
h = "4.85cm"
styles = "card_body"
paragraphs = [
  { text = "One logical thread per page; the deck moves macro -> micro -> macro." },
  { text = "- One thread, not a list of facts" },
  { text = "- Each page holds up the title and the takeaway" },
  { text = "**Outcome:** a deck that holds together" },
]

# Step 3.
[[shapes]]
type = "rect"
x = "16.8cm"
y = "7.8cm"
w = "7.2cm"
h = "1.3cm"
styles = "card_header"
align = "center"
text = "PHASE 3 · Geometry"

[[shapes]]
type = "rect"
x = "16.8cm"
y = "9.1cm"
w = "7.2cm"
h = "6.45cm"
styles = "card_body"
paragraphs = [
  { text = "Compute the geometry: 33.88 x 19.05cm, centre 16.94cm." },
  { text = "- Symmetric columns: 1.5/15 + 17.4/15" },
  { text = "- Content region 2.7-15.9cm" },
  { text = "- Margin on every text-carrying shape" },
  { text = "**Outcome:** balanced columns" },
]

