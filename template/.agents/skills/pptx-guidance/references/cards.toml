# Cards + staircase as a worked methodology example: the equal-width card
# pattern (card_header + card_body) arranged as a staircase of writing
# principles (Claim -> Structure -> Geometry -> Review). A framing band on
# top, four step-cards rising left to right on the y=15.55 baseline, each
# with a centered header subtitle. The top-left annotation fills the diagonal
# corner instead of leaving it empty.
# Master: "content". Copy into slides/ and list in a [[sections]] entry.

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: Title - an observation plus what it implies"

# Framing band stating the single logical thread.
[[shapes]]
type = "rect"
x = "1.5cm"
y = "2.5cm"
w = "30.9cm"
h = "1.3cm"
fill = { color = "F7F7F7" }
line = { type = "none" }

[[shapes]]
type = "text"
x = "1.5cm"
y = "2.5cm"
w = "30.9cm"
h = "1.3cm"
text = "**Every principle builds on the previous one** - from the title claim to a slide that reads at a glance."
font_size = 13
color = "1D1D1B"
valign = "middle"
margin = ["0.1cm", "0.4cm", "0.1cm", "0.4cm"]

# Baseline the steps stand on.
[[shapes]]
type = "rect"
x = "1.5cm"
y = "15.55cm"
w = "30.9cm"
h = "0.05cm"
fill = { color = "A6A6A6" }
line = { type = "none" }

# Annotation filling the empty top-left diagonal: the staircase leaves a
# blank corner above the lower steps - use it, don't leave it empty.
[[shapes]]
type = "text"
x = "2cm"
y = "4.3cm"
w = "6.5cm"
h = "2.4cm"
font_size = 11.5
color = "1D1D1B"
valign = "top"
margin = 0
text = """**Read the diagonal:**
each step inherits the one before."""

