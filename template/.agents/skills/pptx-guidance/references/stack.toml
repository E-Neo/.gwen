# ---- 中间：旋转后的透视地面，用作分隔 ----
# SVG 是 258x30（长边横向）。旋转 270 后长边指向右边的细节，
# 短边指向左边的栈。
[[shapes]]
type = "image"
src = "media/perspective-floor.svg"
x = "11.45cm"
y = "8.85cm"
w = "11cm"
h = "1.3cm"
