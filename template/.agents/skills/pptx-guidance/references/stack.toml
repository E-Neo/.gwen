# 栈图的完整示例：这里把一页胶片拆成它的解剖结构
# （标题 / 正文 / 启示 / 版面 / 配色）。编号圆点标在具体的手法方块上，
# 而不是标在整层上；右栏逐条解释这些手法。
# 所有层都是灰色，红色是唯一的强调色（只用在编号上）。
# 胶片 33.88 x 19.05cm；左边栈 1.5–16.0cm，右栏 18.0–32.5cm。
# master："content"。复制到 slides/ 并在 [[sections]] 里登记。

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: 标题——一个观察，以及它意味着什么"

