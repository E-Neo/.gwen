# 分阶段演进的完整示例：一排箭头就是一个写页面的流程
# （选题 -> 逻辑 -> 结构 -> 版面 -> 打磨），灰色方括号把它分成
# 想清楚 / 做出来 / 复核三段，下面每张阶段卡片示范一种写法。
# 逻辑是整页的核心：标题、正文、启示都围绕同一条逻辑。
# 几何：箭头占 1.5–32.5cm，卡片占 7.1–15.5cm。
# master："content"。复制到 slides/ 并在 [[sections]] 里登记。

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: 标题：一个观察，以及它意味着什么"

# 流程箭头，每个互相重叠 1.0cm。除了要强调的那一步，其余都用灰色。
[[shapes]]
type = "chevron"
x = "1.5cm"
y = "2.8cm"
w = "7cm"
h = "2.6cm"
fill = { color = "A6A6A6" }
line = { type = "none" }
text = "**选题**"
color = "FFFFFF"
align = "center"
valign = "middle"
margin = ["0.1cm", "0.9cm", "0.1cm", "0.4cm"]

