# 阶段卡片：每个阶段一张，由 card_title + card 拼成。
# 想清楚：选题与逻辑。
[[shapes]]
type = "rect"
x = "1.5cm"
y = "7.1cm"
w = "11.2cm"
h = "1.3cm"
styles = "card_title"
align = "center"
text = "一页只讲一条逻辑"

[[shapes]]
type = "rect"
x = "1.5cm"
y = "8.4cm"
w = "11.2cm"
h = "7.1cm"
styles = "card"
text = """**选题**
读者是谁、已经知道什么；题太宽就拆页

**逻辑**
标题是这条逻辑的观点，正文每段都在证明它

- 一条线：现象 → 原因 → 所以呢

**例子**
“成本<span class="accent">30%↓</span>、交付周期缩短两周”
比“降本增效”多说了什么？

**复核**
删掉不支撑这条线的句子"""

# 做出来：结构与版面。
[[shapes]]
type = "rect"
x = "13.3cm"
y = "7.1cm"
w = "11.4cm"
h = "1.3cm"
styles = "card_title"
align = "center"
text = "版面是算出来的"

[[shapes]]
type = "rect"
x = "13.3cm"
y = "8.4cm"
w = "11.4cm"
h = "7.1cm"
styles = "card"
text = """**结构**
总-分-总；一页只承担一步

**版面**
33.88 × 19.05cm，中线 16.94cm

- 对称两栏：1.5/15 + 17.4/15
- 启示行 16.25cm

**例子**
左栏现状、右栏改法，中间用双三角箭头连接

**复核**
卡片顶端、宽度、文字边界共用基准线"""

# 复核：打磨。
[[shapes]]
type = "rect"
x = "25.3cm"
y = "7.1cm"
w = "7.14cm"
h = "1.3cm"
styles = "card_title"
align = "center"
text = "打磨到没有死白"

[[shapes]]
type = "rect"
x = "25.3cm"
y = "8.4cm"
w = "7.14cm"
h = "7.1cm"
styles = "card"
text = """**密度**
填掉大空洞，不塞废话

**一致**
圆角、线宽、字号一套

**复核**
标题、正文、启示都验过

**成果**
没有一处想问“为什么空着”"""

[[shapes]]
type = "text"
x = "1.5cm"
y = "16.25cm"
w = "30.9cm"
h = "0.9cm"
styles = "insight"
text = "逻辑立住了，版面才算得出来；版面算准了，打磨才有意义"
