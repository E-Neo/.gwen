# Phased evolution as a worked methodology example: the chevron row is a
# slide-writing workflow (Topic -> Claim -> Structure -> Layout -> Polish),
# grey brackets group it into THINK / BUILD / REVIEW, and each phase card
# below teaches one writing technique. The layouts are the point; the content
# is the method.
# Geometry: chevrons span 1.5-32.5cm, cards fill 7.1-15.5cm.
# Master: "content". Copy into slides/ and list in a [[sections]] entry.

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: Title - an observation plus what it implies"

# Workflow chevrons, overlapping by 1.0cm. Grey except the emphasized step.
