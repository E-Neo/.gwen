# Phase cards: one per workflow group, built from card_header + card_body.
# THINK - the title.
[[shapes]]
type = "rect"
x = "1.5cm"
y = "7.1cm"
w = "11.2cm"
h = "1.3cm"
styles = "card_header"
align = "center"
text = "The title is a claim"

[[shapes]]
type = "rect"
x = "1.5cm"
y = "8.4cm"
w = "11.2cm"
h = "7.1cm"
styles = "card_body"
text = """- **Formula:** observation + what it implies
- **Quantify:** "TPS 5×↑", "cost 50%↓"
- **Length:** one line if you can
- **Watch out:** a keyword is not a title
- **Serves:** the reader who only reads the title"""

# BUILD - the layout.
[[shapes]]
type = "rect"
x = "13cm"
y = "7.1cm"
w = "11.7cm"
h = "1.3cm"
styles = "card_header"
align = "center"
text = "Layout is computed"

[[shapes]]
type = "rect"
x = "13cm"
y = "8.4cm"
w = "11.7cm"
h = "7.1cm"
styles = "card_body"
text = """- **Slide:** 33.88 x 19.05cm, centre at 16.94cm
- **Columns:** symmetric, e.g. 1.5cm/15cm + 17.4cm/15cm
- **Content region:** roughly 2.7-15.9cm
- **Takeaway row:** around 16.25cm
- **Margins:** ["0.13cm", "0.25cm", "0.13cm", "0.25cm"] on text shapes"""

# REVIEW - the takeaway.
[[shapes]]
type = "rect"
x = "25.2cm"
y = "7.1cm"
w = "7.3cm"
h = "1.3cm"
styles = "card_header"
align = "center"
text = "The takeaway lands"

[[shapes]]
type = "rect"
x = "25.2cm"
y = "8.4cm"
w = "7.3cm"
h = "7.1cm"
styles = "card_body"
text = """- **Formula:** so-what + now-what
- **Style:** 16pt bold blue, centred
- **Length:** one line, up to 50 chars
- **Reminder:** some readers see only the title and the takeaway"""

[[shapes]]
type = "text"
x = "1.5cm"
y = "16.25cm"
w = "30.9cm"
h = "0.9cm"
styles = "insight"
text = "State the claim, compute the layout, and land the takeaway."