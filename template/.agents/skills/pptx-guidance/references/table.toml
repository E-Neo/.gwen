x = "2cm"
y = "3.6cm"
w = "6cm"
h = "1.4cm"
fill = { color = "EDEDED" }
line = { color = "D3D3D3", width = 1 }
align = "center"
valign = "middle"
font_size = 12
bold = true
color = "1D1D1B"
text = "Item"

