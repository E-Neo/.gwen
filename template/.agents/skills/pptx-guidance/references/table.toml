# A table sketched with rectangles: header row shaded, label column on the
# left, one rect per cell carrying its text. For a merged-header look, draw
# one wide rect across several cells and let the cell text start below it.
# Master: "content". Copy into slides/ and list in a [[sections]] entry.

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: Title - an observation plus what it implies"

# Header row.
