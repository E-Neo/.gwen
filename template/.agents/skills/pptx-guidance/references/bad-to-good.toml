# Bad -> Good: a grey panel with the current state's problems on the left, a
# wide borderless grey arrow in the middle, and a panel with the better state
# and its value on the right. The panels are rects carrying their own text.
# Master: "content". Copy into slides/ and list in a [[sections]] entry.

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: Title - an observation plus what it implies"

# AS-IS / others: the problem.
[[shapes]]
type = "rect"
x = "1.5cm"
y = "3.6cm"
w = "12.5cm"
h = "7.8cm"
fill = { color = "F2F2F2" }
line = { color = "D3D3D3", width = 1 }
align = "left"
valign = "top"
font_size = 12
color = "1D1D1B"
margin = ["0.5cm", "0.5cm", "0.5cm", "0.5cm"]
text = "**AS-IS / others: the problem**\n- Pain point one\n- Pain point two\n- Pain point three"

# The grey arrow between the two panels.
[[shapes]]
type = "right_arrow"
x = "14.4cm"
y = "5.4cm"
w = "4.5cm"
h = "3.6cm"
fill = { color = "D3D3D3" }
line = { type = "none" }

# TO-BE / ours: the value.
[[shapes]]
type = "rect"
x = "19.4cm"
y = "3.6cm"
w = "12.5cm"
h = "7.8cm"
fill = { color = "F2F2F2" }
line = { color = "D3D3D3", width = 1 }
align = "left"
valign = "top"
font_size = 12
color = "1D1D1B"
margin = ["0.5cm", "0.5cm", "0.5cm", "0.5cm"]
text = "**TO-BE / ours: the value**\n- Improvement one\n- Improvement two\n- Quantified value, e.g. TPS up 5x"

# Takeaway: so-what + now-what, one line.
[[shapes]]
type = "text"
x = "1cm"
y = "15.9cm"
w = "31.8cm"
h = "1.1cm"
align = "center"
font_size = 16
bold = true
color = "0000FF"
text = "TODO: so-what and now-what, ideally within 50 characters"

[[shapes]]
type = "text"
x = "1cm"
y = "17.1cm"
w = "31.8cm"
h = "0.5cm"
font_size = 10.5
italic = true
color = "A3A3A3"
text = "TODO: source reference"
