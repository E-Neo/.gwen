# Bad -> Good 的完整示例：左边框放关键词标题，中间用双三角箭头连接，
# 右边框把同一批主题改写成主张；下方第三个框放一张紧凑的对照表。
# 三个框都是 frame 变体：圆角边框 + 骑在顶边上的 frame_title。
# 几何：上排 1.5–13.5 / 16.1–32.4，下排 1.5–32.4；箭头宽 1.55cm。
# master："content"。复制到 slides/ 并在 [[sections]] 里登记。

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: 标题——一个观察，以及它意味着什么"

# 左框：关键词标题——读完不知道结论。
[[shapes]]
type = "round_rect"
x = "1.5cm"
y = "3.5cm"
w = "12cm"
h = "7.4cm"
rect_radius = 0.1
styles = "frame"
text = """**“某某入门”**
读者不知道你要说什么。

**“技术介绍”**
读完还是不知道结论。

**“趋势展望”**
没有观点，也没有证据。

**“方法分享”**
听完不知道怎么做。

关键词标题只是目录；目录不是观点。"""

[[shapes]]
type = "text"
x = "5.2cm"
y = "3.05cm"
w = "4.6cm"
h = "0.9cm"
styles = "frame_title"
text = "关键词标题"

# 中间：双三角箭头，从坏例子指向改写后的主张。
[[shapes]]
type = "image"
src = "media/two-triangles-right-arrow.svg"
x = "14.02cm"
y = "4.4cm"
w = "1.55cm"
h = "6.2cm"

[[shapes]]
type = "text"
x = "13.6cm"
y = "10.55cm"
w = "2.4cm"
h = "0.4cm"
text = "改写"
font_size = 9
color = "808080"
align = "center"
valign = "middle"
margin = 0

# 右框：同一批主题，改写成主张。
[[shapes]]
type = "round_rect"
x = "16.1cm"
y = "3.5cm"
w = "16.3cm"
h = "7.4cm"
rect_radius = 0.1
styles = "frame"
text = """**反例**：“某某入门”
**改写**：“3 天独立出片：模板 + 检查清单把返工降到 1 次。”

**反例**：“技术介绍”
**改写**：“一页一条逻辑：读者 10 秒能复述结论。”

**反例**：“趋势展望”
**改写**：“标题先立主张：扫一眼就知道价值在哪。”

**反例**：“方法分享”
**改写**：“六页版式一次配齐，出片快<span class="accent">5×↑</span>、成本<span class="accent">50%↓</span>。”

同一批主题，多给一句“意味着什么”，目录就变成了观点。"""

[[shapes]]
type = "text"
x = "21.85cm"
y = "3.05cm"
w = "4.8cm"
h = "0.9cm"
styles = "frame_title"
text = "主张标题"

# 下框：一张对照表——只留横线，不加强底色和竖线。
