# Frames as a worked methodology example: three round_rect frames (y=3.9,
# h=10.2) with centered labels straddling the top edge. The first two teach
# geometry and title-writing; the third carries a compact comparison table
# (keyword title vs claim title) - rows separated by thin horizontal lines,
# text cells with compact margins, no header fill, no vertical bars.
# Frames are symmetric: 1.5-11.5, 12-22, 22.5-32.5cm.
# Master: "content". Copy into slides/ and list in a [[sections]] entry.

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: Title - an observation plus what it implies"

# Frame 1: geometry.
[[shapes]]
type = "round_rect"
x = "1.5cm"
y = "3.9cm"
w = "10cm"
h = "10.2cm"
rect_radius = 0.1
styles = "frame"
text = """**Slide**

33.88 x 19.05cm; the centre is at 16.94cm.

**Content region**

Roughly 2.7-15.9cm; the takeaway row about 16.25cm.

**Columns**

Symmetric - left 1.5/15cm, right 17.4/15cm.

**Rule**

Margins mirror each other; a lopsided slide reads as unfinished."""

[[shapes]]
type = "text"
x = "3.8cm"
y = "3.35cm"
w = "5.4cm"
h = "0.9cm"
styles = "frame_label"
text = "**Geometry**"

# Frame 2: titles.
[[shapes]]
type = "round_rect"
x = "12cm"
y = "3.9cm"
w = "10cm"
h = "10.2cm"
rect_radius = 0.1
styles = "frame"
text = """**A claim**

Observation + what it implies.

**Not a keyword**

An "introduction to X" says nothing.

**Quantify**

"5×↑ faster", "50%↓ cheaper".

**One line**

Some readers only ever read the title."""

[[shapes]]
type = "text"
x = "14.05cm"
y = "3.35cm"
w = "5.9cm"
h = "0.9cm"
styles = "frame_label"
text = "**Title**"

# Frame 3: a small comparison table instead of long text.
[[shapes]]
type = "round_rect"
x = "22.5cm"
y = "3.9cm"
w = "10cm"
h = "10.2cm"
rect_radius = 0.1
styles = "frame"

[[shapes]]
type = "text"
x = "23.1cm"
y = "3.35cm"
w = "8.8cm"
h = "0.9cm"
styles = "frame_label"
text = "**Two kinds of title**"

