# Phased evolution as a staircase: steps rise left to right, each step is a
# stage. Notes live above the stairs; an arrow at the top points at the
# future trend.
# Master: "content". Copy into slides/ and list in a [[sections]] entry.

master = "content"

[[shapes]]
type = "text"
placeholder = "title"
text = "TODO: Title - an observation plus what it implies"

# Stage notes: characteristics on the left, needs/trend on the right.
[[shapes]]
type = "text"
x = "1cm"
y = "3cm"
w = "15cm"
h = "3.4cm"
font_size = 12
color = "1D1D1B"
valign = "top"
text = "- **Phase 1**: what it looked like\n- **Phase 2**: what changed\n- **Phase 3**: what took hold\n- **Phase 4**: what is emerging"

[[shapes]]
