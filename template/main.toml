[presentation]
title = "template"
height = 6858000
width = 12196763

[[sections]]
slides = ["cover.toml"]
title = "Cover"

[[sections]]
slides = ["example_content.toml"]
title = "Content"

[[sections]]
slides = ["end.toml"]
title = "End"

[styles.shape]
margin = 0
align = "left"
valign = "top"
line = { width = 1, color = "D3D3D3" }
font_face = "Microsoft YaHei"

[styles.text]
line = { type = "none" }

[styles.named.insight]
font_face = "Microsoft YaHei"
font_size = 16
color = "0000FF"
bold = true
align = "center"
valign = "middle"
margin = 0

[styles.named.source]
font_face = "Microsoft YaHei"
font_size = 10.5
color = "A3A3A3"
italic = true

[styles.named.card_header]
font_face = "Microsoft YaHei"
font_size = 15
bold = true
color = "000000"
fill = { color = "CCECFF" }
line = { type = "none" }
valign = "middle"
margin = ["0.1cm", "0.45cm", "0.1cm", "0.45cm"]

[styles.named.card_body]
font_face = "Microsoft YaHei"
font_size = 11.5
color = "1D1D1B"
fill = { color = "F2F2F2" }
line = { color = "D3D3D3", width = 1 }
valign = "top"
margin = [10, 14, 6, 14]
para_space_before = 3

[styles.named.frame]
font_face = "Microsoft YaHei"
font_size = 11.5
color = "1D1D1B"
fill = { color = "FFFFFF" }
line = { color = "D3D3D3", width = 1 }
valign = "top"
margin = [31, 20, 11, 20]
para_space_before = 6

[styles.named.frame_label]
font_face = "Microsoft YaHei"
font_size = 15.5
bold = true
color = "0000FF"
fill = { color = "FFFFFF" }
line = { type = "none" }
align = "center"
valign = "middle"
margin = [1, 6, 1, 6]

[theme]
major_font = "Arial Black"
minor_font = "Arial"
