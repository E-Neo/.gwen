[presentation]
title = "template"
height = 6858000
width = 12196763

[[sections]]
slides = ["cover.toml"]
title = "Cover"

[[sections]]
slides = ["example_content.toml"]
title = "Content"

[[sections]]
slides = ["end.toml"]
title = "End"

[styles.shape]
align = "left"
valign = "top"
margin = ["0.13cm", "0.25cm", "0.13cm", "0.25cm"]
line = { width = 1, color = "D3D3D3" }
font_face = "Microsoft YaHei"
font_size = 14
bullet_indent = 10

[styles.text]
margin = 0
line = { type = "none" }

[styles.placeholder]
margin = 0
line = { type = "none" }

[styles.named.accent]
color = "C7000A"
bold = true

[styles.named.insight]
font_size = 16
color = "0000FF"
bold = true
align = "center"
valign = "middle"
margin = 0

[styles.named.source]
font_size = 10.5
color = "A3A3A3"
italic = true

[styles.named.card_title]
font_size = 16
bold = true
color = "000000"
fill = { color = "CCECFF" }
line = { type = "none" }
align = "center"
valign = "middle"
margin = 0

[styles.named.card]
color = "1D1D1B"
fill = { color = "F2F2F2" }
line = { type = "none" }
valign = "top"
para_space_before = 3

[styles.named.frame_title]
font_size = 16
bold = true
color = "0000FF"
fill = { color = "FFFFFF" }
line = { type = "none" }
align = "center"
valign = "middle"
margin = 0

[styles.named.frame]
color = "1D1D1B"
fill = { color = "FFFFFF" }
line = { color = "D3D3D3", width = 1 }
valign = "top"
para_space_before = 3

[theme]
major_font = "Arial Black"
minor_font = "Arial"
